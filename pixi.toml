[project]
name = "claudecode-session-orchestrator"
description = "ClaudeCode Session Orchestrator with zero-tolerance quality policy"
version = "0.1.0"
channels = ["conda-forge", "python"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = ">=3.9"
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
black = "*"
flake8 = "*"
mypy = "*"
bandit = "*"
safety = "*"
isort = "*"

[tasks]
# Zero-tolerance quality gates - ALL MUST PASS
test = "pytest --tb=short -v --cov=. --cov-report=html --cov-report=term --cov-fail-under=100"
lint = "flake8 --max-line-length=88 --extend-ignore=E203,W503 --max-complexity=10 --statistics"
format-check = "black --check --diff ."
format = "black ."
type-check = "mypy . --ignore-missing-imports --strict"
security-scan = "bandit -r . -ll && safety check"
sort-imports = "isort . --check-only --diff"
fix-imports = "isort ."

# Comprehensive quality validation
quality = "python scripts/quality-check.py"

# Emergency fix protocols
fix-lint-violations = "python scripts/emergency-fix.py"

# Coverage reporting
coverage = "pytest --cov=. --cov-report=html --cov-report=term --cov-report=xml --cov-fail-under=100"

# Pre-commit hook integration
pre-commit-install = "pre-commit install"
pre-commit = "pre-commit run --all-files"

# Complete validation pipeline
check-all = "python scripts/quality-pipeline.py"

# Security audit
security-audit = "python scripts/security-audit.py"
EOF < /dev/null
