name: Code Quality & Pre-commit

on:
  push:
    branches: [ main, master, develop, development ]
  pull_request:
    branches: [ main, master, develop, development ]
  workflow_dispatch:

env:
  PYTHONNOUSERSITE: 1
  PIXI_VERSION: v0.49.0

jobs:
  # =============================================================================
  # PRE-COMMIT VALIDATION
  # =============================================================================
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PIXI
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: default

      - name: Install dependencies (default environment)
        run: pixi install -e default

      - name: Run pre-commit hooks
        run: pixi run -e default pre-commit

  # =============================================================================
  # RUFF QUALITY CHECKS
  # =============================================================================
  ruff-analysis:
    name: Ruff Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PIXI
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: ci

      - name: Install dependencies
        run: pixi install -e ci

      - name: Ruff linting
        run: pixi run -e ci lint

      - name: Ruff format check
        run: pixi run -e ci format-check

      - name: Import sorting check
        run: pixi run -e ci check-imports

  # =============================================================================
  # TYPE CHECKING
  # =============================================================================
  type-check:
    name: MyPy Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PIXI
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: ci

      - name: Install dependencies
        run: pixi install -e ci

      - name: Run MyPy type checking
        run: pixi run -e ci type-check

  # =============================================================================
  # COMPREHENSIVE QUALITY GATE
  # =============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [pre-commit, ruff-analysis, type-check]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PIXI
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: ci

      - name: Install dependencies
        run: pixi install -e ci

      - name: Comprehensive quality check
        run: pixi run -e ci quality

      - name: Quality gate success
        run: |
          echo "🎯 Quality Gate: PASSED"
          echo "✅ Pre-commit hooks: PASSED"
          echo "✅ Ruff linting: PASSED"
          echo "✅ Code formatting: PASSED"
          echo "✅ Import sorting: PASSED"
          echo "✅ Type checking: PASSED"
          echo ""
          echo "Code quality standards met."