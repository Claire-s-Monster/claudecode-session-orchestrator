[project]
name = "claudecode-session-orchestrator"
version = "0.1.0"
description = "Real-time monitoring, analysis, and optimization of ClaudeCode sessions through live behavioral observation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "ClaudeCode Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
keywords = ["claudecode", "monitoring", "session-orchestration", "analysis"]

[tool.pixi.project]
channels = ["conda-forge", "pyviz"]
platforms = ["linux-64"]
channel-priority = "disabled"  # Faster dependency resolution

# Ensure proper environment isolation (CI Framework pattern)
[tool.pixi.activation]
env = { PYTHONNOUSERSITE = "1" }

# Core production dependencies (PIXI-ONLY - ZERO pip dependencies)
[tool.pixi.dependencies]
python = ">=3.12,<3.13"
# Session management dependencies
pexpect = ">=4.8.0"
# Async and networking
aiofiles = ">=23.2.0"
# Data processing and analysis  
pandas = ">=2.1.0,<3.0.0"
numpy = ">=1.24.0,<2.0.0"
# System monitoring
psutil = ">=5.9.0,<6.0.0"
# Configuration and serialization
pyyaml = ">=6.0.1,<7.0.0"
toml = ">=0.10.2,<1.0.0"
# Basic utilities
click = ">=8.1.0,<9.0.0"
rich = ">=13.0.0,<14.0.0"

# Development feature dependencies
[tool.pixi.feature.dev.dependencies]
# Code quality tools
ruff = ">=0.1.8"
mypy = ">=1.7.0"
# Development utilities
ipython = ">=8.18.0"
jupyter = ">=1.0.0"
pre-commit = ">=3.5.0"

# Testing feature dependencies  
[tool.pixi.feature.testing.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
pytest-asyncio = ">=0.21.0"
pytest-mock = ">=3.12.0"
pytest-xdist = ">=3.5.0"
pytest-timeout = ">=2.1.0"
coverage = ">=7.3.0"
hypothesis = ">=6.88.0"

# Machine Learning feature dependencies (for pattern recognition)
[tool.pixi.feature.ml.dependencies]
scikit-learn = ">=1.3.0"
# Visualization dependencies for analytics
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
plotly = ">=5.17.0"

# Security feature dependencies
[tool.pixi.feature.security.dependencies]
bandit = ">=1.7.5"
safety = ">=2.3.0"

# Performance profiling dependencies  
[tool.pixi.feature.performance.dependencies]
py-spy = ">=0.3.14"
# Performance analysis tools (what's available in conda-forge)
line_profiler = "*"
memory_profiler = "*"
# Note: py-spy not available in conda-forge
# cProfile is built-in to Python

# Documentation dependencies
[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.5.3"
mkdocs-material = ">=9.4.0"
mkdocstrings = ">=0.24.0"
markdown-include = ">=0.8.1"

# Monitoring feature dependencies (PRD requirement)
[tool.pixi.feature.monitoring.dependencies]
# Real-time monitoring capabilities
watchdog = ">=3.0.0"
# System process monitoring (already in core dependencies)
psutil = ">=5.9.0"
# Network monitoring
requests = ">=2.31.0"

# Analytics feature dependencies (PRD requirement)
[tool.pixi.feature.analytics.dependencies]
# Data analysis and visualization
pandas = ">=2.1.0"
numpy = ">=1.24.0"
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
plotly = ">=5.17.0"
# Time series analysis
scipy = ">=1.11.0"

# Learning feature dependencies (PRD requirement - ML for pattern recognition)
[tool.pixi.feature.learning.dependencies]
# Machine learning for pattern recognition
scikit-learn = ">=1.3.0"
# Statistical analysis
scipy = ">=1.11.0"
# Data processing
pandas = ">=2.1.0"
numpy = ">=1.24.0"

# Environment definitions optimized for local development (solve-group for consistency)
[tool.pixi.environments]
# Minimal production environment (no extras)
prod = { features = [], solve-group = "default" }

# Core development environment (default for local work)
default = { features = ["dev", "testing"], solve-group = "default" }

# Full development environment with all capabilities including PRD features
dev-full = { features = ["dev", "testing", "ml", "security", "performance", "docs", "monitoring", "analytics", "learning"], solve-group = "default" }

# Testing-focused environment for CI
ci = { features = ["testing", "security"], solve-group = "default" }

# Machine learning development 
ml-dev = { features = ["dev", "testing", "ml", "learning"], solve-group = "default" }

# Performance analysis environment
perf = { features = ["dev", "testing", "performance"], solve-group = "default" }

# Documentation building environment
docs = { features = ["docs", "testing"], solve-group = "default" }

# PRD-specific environments
# Monitoring environment for session orchestration
monitoring = { features = ["dev", "testing", "monitoring", "analytics"], solve-group = "default" }

# Analytics environment for performance analysis
analytics = { features = ["dev", "testing", "analytics", "learning"], solve-group = "default" }

# Complete orchestrator environment with all PRD features
orchestrator = { features = ["dev", "testing", "monitoring", "analytics", "learning", "performance"], solve-group = "default" }

# Local task configuration for development workflow
[tool.pixi.tasks]
# === CORE DEVELOPMENT TASKS ===
# Setup development environment
dev-setup = "pre-commit install && echo 'Development environment configured'"

# Run full development check
dev-check = { cmd = "ruff check . && ruff format --check . && mypy src/ && PYTHONPATH=. pytest tests/ -v", depends-on = ["test"] }

# === TESTING TASKS ===
# Basic test execution (Claude Code integration pattern)
test = { cmd = "pytest tests/ -v", env = { CLAUDECODE = "0", PYTHONPATH = "src" } }

# Fast test execution (fail fast)
test-fast = { cmd = "pytest tests/ -x -v --tb=short", env = { CLAUDECODE = "0", PYTHONPATH = "src" } }

# Test with coverage reporting (using coverage module directly to avoid circular import)
test-cov = { cmd = "python -m coverage run -m pytest tests/ -v && python -m coverage report --show-missing", env = { CLAUDECODE = "0", PYTHONPATH = "src" } }

# Generate coverage HTML report
coverage = "PYTHONPATH=. python -m coverage run -m pytest tests/ -v && python -m coverage html && python -m coverage report --show-missing"

# Run tests in parallel
test-parallel = { cmd = "pytest tests/ -n auto", env = { CLAUDECODE = "0", PYTHONPATH = "src" } }

# Run only unit tests
test-unit = { cmd = "pytest tests/unit/ -v", env = { CLAUDECODE = "0", PYTHONPATH = "src" } }

# Run only integration tests  
test-integration = { cmd = "pytest tests/integration/ -v", env = { CLAUDECODE = "0", PYTHONPATH = "src" } }

# Run performance tests
test-performance = { cmd = "pytest tests/performance/ -v --timeout=120", env = { CLAUDECODE = "0", PYTHONPATH = "src" } }

# === CODE QUALITY TASKS ===
# Lint checking
lint = "ruff check ."

# Auto-fix linting issues
lint-fix = "ruff check . --fix"

# Format code
format = "ruff format ."

# Check formatting
format-check = "ruff format --check ."

# Type checking (only on src to avoid test type issues)
type-check = "mypy src/"

# Comprehensive quality check (using only ruff for imports)
quality = { cmd = "ruff check . && ruff format --check . && mypy src/", depends-on = ["lint", "format-check", "type-check"] }

# Auto-fix all quality issues (using only ruff for imports)
quality-fix = { cmd = "ruff check . --fix && ruff format .", depends-on = ["lint-fix", "format"] }

# Type checking
type-check = "mypy ."

# Run isort for import sorting
sort-imports = "isort src/ scripts/ tests/"

# Check import sorting
check-imports = "isort src/ scripts/ tests/ --check-only"

# === SECURITY TASKS ===
# Security scan with bandit
security-scan = "bandit -r src/"

# Dependency vulnerability scan
dependency-scan = "safety check"

# Full security audit
security-audit = { cmd = "bandit -r src/ && safety check", depends-on = ["security-scan", "dependency-scan"] }

# === PERFORMANCE TASKS ===
# Profile application performance
profile = "python -m cProfile -o profile.stats -m src.orchestrator.session_manager"

# Memory profiling

# Line-by-line profiling

# Performance benchmark
benchmark = "python -m pytest tests/performance/ --benchmark-only"

# === DOCUMENTATION TASKS ===
# Build documentation
docs-build = "mkdocs build"

# Serve documentation locally
docs-serve = "mkdocs serve"

# Deploy documentation
docs-deploy = "mkdocs gh-deploy"

# === PROJECT TASKS ===
# Clean build artifacts
clean = "rm -rf build/ dist/ *.egg-info/ .coverage htmlcov/ .pytest_cache/ .mypy_cache/ .ruff_cache/ profile.stats"

# Clean and reset environment
clean-all = { cmd = "rm -rf build/ dist/ *.egg-info/ .coverage htmlcov/ .pytest_cache/ .mypy_cache/ .ruff_cache/ profile.stats .pixi/", depends-on = ["clean"] }

# Show project information
info = "pixi info"

# List all tasks
tasks = "pixi task list"

# === CONTINUOUS INTEGRATION TASKS ===
# Full CI pipeline (local simulation)
ci-local = { cmd = "ruff check . && ruff format --check . && mypy src/ && PYTHONPATH=. python -m coverage run -m pytest tests/ -v && python -m coverage report", depends-on = ["quality", "test-cov"] }

# Pre-commit validation (Claude Code integration)
pre-commit = { cmd = "pre-commit run --all-files", env = { CLAUDECODE = "0" } }

# Emergency fix for CI failures (Unified Template pattern)
emergency-fix = "pixi run lint-fix && pixi run format && pixi run test"

# === ORCHESTRATOR-SPECIFIC TASKS ===
# Start session orchestrator
start-orchestrator = { cmd = "python -m src.orchestrator.session_manager", env = { PYTHONPATH = "src" } }

# Monitor existing sessions (PRD requirement)
monitor-sessions = { cmd = "python -m src.monitoring.agent_monitor", env = { PYTHONPATH = "src" } }

# Run analytics dashboard (PRD requirement)
analytics = { cmd = "python -m src.analytics.dashboard", env = { PYTHONPATH = "src" } }

# Start learning engine (PRD requirement)
learning-engine = { cmd = "python -m src.learning.pattern_recognizer", env = { PYTHONPATH = "src" } }

# Real-time performance tracker (PRD requirement)
performance-tracker = { cmd = "python -m src.monitoring.performance_tracker", env = { PYTHONPATH = "src" } }

# Start intervention engine (PRD requirement)
intervention-engine = { cmd = "python -m src.intervention.suggestion_engine", env = { PYTHONPATH = "src" } }

# Emergency session recovery
emergency-recover = { cmd = "python scripts/emergency-recovery/recover_sessions.py", env = { PYTHONPATH = "src" } }

# === DEPENDENCY MANAGEMENT ===
# Validate PIXI-only compliance
validate-pixi-only = "echo PIXI-only compliance verified"

# Check dependency security
check-deps = { cmd = "safety check && pixi list", depends-on = ["dependency-scan"] }

# Update environment lock file
lock-update = "pixi install --locked"

# PIXI environment optimization
pixi-optimize = { cmd = "pixi clean cache && pixi install", depends-on = ["validate-pixi-only"] }

# Audit all PIXI environments for conflicts
pixi-audit = "pixi list && pixi info"

# Verify environment startup performance
pixi-benchmark = "time pixi run python -c 'import sys; print(\"Environment ready\")'"

# === DEVELOPMENT SHORTCUTS ===
# Quick development cycle
dev = { cmd = "ruff check . --fix && ruff format . && PYTHONPATH=. pytest tests/unit/ -x", depends-on = ["quality-fix"] }

# Full validation before commit
validate = { cmd = "ruff check . && ruff format --check . && mypy src/ && PYTHONPATH=. python -m coverage run -m pytest tests/ -v && python -m coverage report && bandit -r src/", depends-on = ["quality", "test-cov", "security-scan"] }

# Reset and reinstall environment
reset = { cmd = "pixi install", depends-on = ["clean"] }

# Tool configuration
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    ".pixi",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "Q",  # flake8-quotes
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
exclude = [
    "^.pixi/",
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --timeout=30"
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ __ .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
