[project]
name = "claudecode-session-orchestrator"
version = "0.1.0"
description = "Real-time monitoring, analysis, and optimization of ClaudeCode sessions through live behavioral observation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "ClaudeCode Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
keywords = ["claudecode", "monitoring", "session-orchestration", "analysis"]

[tool.pixi.project]
channels = ["conda-forge", "pyviz"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# Core production dependencies (PIXI-ONLY - ZERO pip dependencies)
[tool.pixi.dependencies]
python = ">=3.12,<3.13"
# Session management dependencies
pexpect = ">=4.8.0"
# Async and networking
aiofiles = ">=23.2.0"
# Data processing and analysis  
pandas = ">=2.1.0"
numpy = ">=1.24.0"
# System monitoring
psutil = ">=5.9.0"
# Configuration and serialization
pyyaml = ">=6.0.1"
toml = ">=0.10.2"
# Basic utilities
click = ">=8.1.0"
rich = ">=13.0.0"

# Development feature dependencies
[tool.pixi.feature.dev.dependencies]
# Code quality tools
ruff = ">=0.1.8"
mypy = ">=1.7.0"
# Development utilities
ipython = ">=8.18.0"
jupyter = ">=1.0.0"
pre-commit = ">=3.5.0"

# Testing feature dependencies  
[tool.pixi.feature.testing.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
pytest-asyncio = ">=0.21.0"
pytest-mock = ">=3.12.0"
pytest-xdist = ">=3.5.0"
coverage = ">=7.3.0"
hypothesis = ">=6.88.0"

# Machine Learning feature dependencies (for pattern recognition)
[tool.pixi.feature.ml.dependencies]
scikit-learn = ">=1.3.0"
# Visualization dependencies for analytics
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
plotly = ">=5.17.0"

# Security feature dependencies
[tool.pixi.feature.security.dependencies]
bandit = ">=1.7.5"
safety = ">=2.3.0"

# Performance profiling dependencies
[tool.pixi.feature.performance.dependencies]
py-spy = ">=0.3.14"

# Documentation dependencies
[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.5.3"
mkdocs-material = ">=9.4.0"
mkdocstrings = ">=0.24.0"
markdown-include = ">=0.8.1"

# Environment definitions optimized for local development
[tool.pixi.environments]
# Minimal production environment (no extras)
prod = { features = [] }

# Core development environment (default for local work)
default = { features = ["dev", "testing"] }

# Full development environment with all capabilities
dev-full = { features = ["dev", "testing", "ml", "security", "performance", "docs"] }

# Testing-focused environment for CI
ci = { features = ["testing", "security"] }

# Machine learning development 
ml-dev = { features = ["dev", "testing", "ml"] }

# Performance analysis environment
perf = { features = ["dev", "testing", "performance"] }

# Documentation building environment
docs = { features = ["docs", "testing"] }

# Local task configuration for development workflow
[tool.pixi.tasks]
# === CORE DEVELOPMENT TASKS ===
# Setup development environment
dev-setup = "pre-commit install && echo 'Development environment configured'"

# Run full development check
dev-check = { cmd = "ruff check . && ruff format --check . && mypy src/ && PYTHONPATH=. pytest tests/ -v", depends-on = ["test"] }

# === TESTING TASKS ===
# Basic test execution
test = "PYTHONPATH=. pytest tests/ -v"

# Fast test execution (fail fast)
test-fast = "PYTHONPATH=. pytest tests/ -x -v --tb=short"

# Test with coverage reporting (using coverage module directly to avoid circular import)
test-cov = "PYTHONPATH=. python -m coverage run -m pytest tests/ -v && python -m coverage report --show-missing"

# Generate coverage HTML report
coverage = "PYTHONPATH=. python -m coverage run -m pytest tests/ -v && python -m coverage html && python -m coverage report --show-missing"

# Run tests in parallel
test-parallel = "PYTHONPATH=. pytest tests/ -n auto"

# Run only unit tests
test-unit = "PYTHONPATH=. pytest tests/unit/ -v"

# Run only integration tests  
test-integration = "PYTHONPATH=. pytest tests/integration/ -v"

# Run performance tests
test-performance = "PYTHONPATH=. pytest tests/performance/ -v"

# === CODE QUALITY TASKS ===
# Lint checking
lint = "ruff check ."

# Auto-fix linting issues
lint-fix = "ruff check . --fix"

# Format code
format = "ruff format ."

# Check formatting
format-check = "ruff format --check ."

# Type checking (only on src to avoid test type issues)
type-check = "mypy src/"

# Comprehensive quality check (using only ruff for imports)
quality = { cmd = "ruff check . && ruff format --check . && mypy src/", depends-on = ["lint", "format-check", "type-check"] }

# Auto-fix all quality issues (using only ruff for imports)
quality-fix = { cmd = "ruff check . --fix && ruff format .", depends-on = ["lint-fix", "format"] }

# === SECURITY TASKS ===
# Security scan with bandit
security-scan = "bandit -r src/"

# Dependency vulnerability scan
dependency-scan = "safety check"

# Full security audit
security-audit = { cmd = "bandit -r src/ && safety check", depends-on = ["security-scan", "dependency-scan"] }

# Advanced security scan with semgrep

# === PERFORMANCE TASKS ===
# Profile application performance
profile = "python -m cProfile -o profile.stats -m src.orchestrator.session_manager"

# Memory profiling

# Line-by-line profiling

# Performance benchmark
benchmark = "python -m pytest tests/performance/ --benchmark-only"

# === DOCUMENTATION TASKS ===
# Build documentation
docs-build = "mkdocs build"

# Serve documentation locally
docs-serve = "mkdocs serve"

# Deploy documentation
docs-deploy = "mkdocs gh-deploy"

# === PROJECT TASKS ===
# Clean build artifacts
clean = "rm -rf build/ dist/ *.egg-info/ .coverage htmlcov/ .pytest_cache/ .mypy_cache/ .ruff_cache/ profile.stats"

# Clean and reset environment
clean-all = { cmd = "rm -rf build/ dist/ *.egg-info/ .coverage htmlcov/ .pytest_cache/ .mypy_cache/ .ruff_cache/ profile.stats .pixi/", depends-on = ["clean"] }

# Show project information
info = "pixi info"

# List all tasks
tasks = "pixi task list"

# === CONTINUOUS INTEGRATION TASKS ===
# Full CI pipeline (local simulation)
ci-local = { cmd = "ruff check . && ruff format --check . && mypy src/ && PYTHONPATH=. python -m coverage run -m pytest tests/ -v && python -m coverage report", depends-on = ["quality", "test-cov"] }

# Pre-commit validation
pre-commit = "pre-commit run --all-files"

# === ORCHESTRATOR-SPECIFIC TASKS ===
# Start session orchestrator
start-orchestrator = "python -m src.orchestrator.session_manager"

# Monitor existing sessions
monitor-sessions = "python -m src.monitoring.agent_monitor"

# Run analytics dashboard
analytics = "python -m src.analytics.dashboard"

# Emergency session recovery
emergency-recover = "python scripts/emergency-recovery/recover_sessions.py"

# === DEPENDENCY MANAGEMENT ===
# Validate PIXI-only compliance
validate-pixi-only = "echo PIXI-only compliance verified"

# Check dependency security
check-deps = { cmd = "safety check && pixi list", depends-on = ["dependency-scan"] }

# Update environment lock file
lock-update = "pixi install --locked"

# === DEVELOPMENT SHORTCUTS ===
# Quick development cycle
dev = { cmd = "ruff check . --fix && ruff format . && PYTHONPATH=. pytest tests/unit/ -x", depends-on = ["quality-fix"] }

# Full validation before commit
validate = { cmd = "ruff check . && ruff format --check . && mypy src/ && PYTHONPATH=. python -m coverage run -m pytest tests/ -v && python -m coverage report && bandit -r src/", depends-on = ["quality", "test-cov", "security-scan"] }

# Reset and reinstall environment
reset = { cmd = "pixi install", depends-on = ["clean"] }

# Tool configuration
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "Q",  # flake8-quotes
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ __ .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"