# Pre-commit hooks configuration for quality enforcement
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Unified linting and formatting with ruff (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      # Linting
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      # Formatting
      - id: ruff-format

  # Type checking (aligned with PIXI mypy configuration)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        language_version: python3.12
        additional_dependencies: []
        args: ["--config-file=pyproject.toml"]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-r", "src/", "-f", "json"]
        exclude: tests/

  # Documentation checks
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ["--convention=google"]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  # PIXI-aligned quality gates (using unified toolchain)
  - repo: local
    hooks:
      # Test execution through PIXI
      - id: pytest
        name: pytest-pixi
        entry: pixi run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Coverage validation through PIXI
      - id: coverage
        name: coverage-pixi
        entry: pixi run test-cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Comprehensive quality gates through PIXI
      - id: quality-gates
        name: quality-gates-pixi
        entry: pixi run quality
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]